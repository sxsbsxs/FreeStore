name: Publish Approved APK Submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: freestore-community-apk-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == 'approved' && startsWith(github.event.issue.title, '[FreeStore APK]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default-branch code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0"

      - name: Publish APK and refresh catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: python3 scripts/publish_submission.py

      - name: Report publishing failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "⚠️ 自动发布没有完成。维护者可以在对应的 GitHub Actions 运行记录中查看错误，修复后重新添加 approved 标签。"
            });

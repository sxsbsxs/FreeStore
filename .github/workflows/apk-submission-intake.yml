name: APK Submission Intake

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    if: startsWith(github.event.issue.title, '[FreeStore APK]')
    runs-on: ubuntu-latest
    steps:
      - name: Add review labels and instructions
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const definitions = [
              { name: "apk-submission", color: "ededed", description: "FreeStore APK submission" },
              { name: "pending-review", color: "fbca04", description: "Waiting for FreeStore moderation" },
              { name: "approved", color: "0e8a16", description: "Approved for publication" },
              { name: "rejected", color: "d73a4a", description: "Submission rejected" },
              { name: "published", color: "1d76db", description: "APK published in FreeStore" }
            ];
            for (const label of definitions) {
              try {
                await github.rest.issues.createLabel({ owner, repo, ...label });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: context.issue.number,
              labels: ["apk-submission", "pending-review"]
            });
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: context.issue.number,
              body: "已收到 FreeStore APK 投稿，当前状态：**等待人工审核**。\n\n审核通过后，FreeStore 会自动发布 APK 并更新应用目录。请保留本 Issue，审核人员可能会在这里联系你。"
            });
